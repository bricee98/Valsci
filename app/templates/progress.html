{% extends "base.html" %}

{% block content %}
    <section class="panel">
        <div class="panel-header">
            <div>
                <h2 class="panel-title">Reference IDs</h2>
                <p class="panel-subtitle">Use these IDs when looking up files, traces, or batch exports.</p>
            </div>
            <a href="{{ url_for('api.guidebook_page') }}#progress" class="help-link" title="Guidebook: Progress">?</a>
        </div>
        <div class="summary-strip" id="referenceList"></div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <div>
                <h2 class="panel-title">Progress</h2>
                <p class="panel-subtitle">This view updates every five seconds while the batch is active.</p>
            </div>
        </div>
        <div id="progressStatus" class="status-card info-card hidden"></div>
        <div id="overallProgress" class="stack"></div>
        <div id="statusBreakdown" class="stack"></div>
        <div id="currentClaim" class="stack"></div>
    </section>

    <script>
        window.progressPageConfig = {
            batchId: {{ batch_id|tojson }},
            claimId: {{ claim_id|tojson }},
        };
    </script>
{% endblock %}

{% block scripts %}
    <script>
        const { escapeHtml, fetchJson, setStatus } = window.ValsciUI;
        const config = window.progressPageConfig || {};
        const batchId = config.batchId;
        const claimId = config.claimId;
        const referenceList = document.getElementById('referenceList');
        const overallProgress = document.getElementById('overallProgress');
        const statusBreakdown = document.getElementById('statusBreakdown');
        const currentClaim = document.getElementById('currentClaim');
        const progressStatus = document.getElementById('progressStatus');

        function renderReferences() {
            const references = [];
            if (batchId) references.push({ label: 'Batch ID', value: batchId });
            if (claimId) references.push({ label: 'Claim ID', value: claimId });
            referenceList.innerHTML = references.length
                ? references.map(item => `
                    <div class="summary-cell">
                        <span class="label">${escapeHtml(item.label)}</span>
                        <span class="value">${escapeHtml(item.value)}</span>
                    </div>
                `).join('')
                : `<div class="empty-state"><strong>No reference IDs were provided.</strong><span>Open this page from a batch or claim run.</span></div>`;
        }

        function renderProgress(data) {
            const total = Number(data.total_claims || 0);
            const processed = Number(data.processed_claims || 0);
            const percent = total > 0 ? (processed / total) * 100 : 0;
            overallProgress.innerHTML = `
                <div class="summary-strip">
                    <div class="summary-cell">
                        <span class="label">Completed</span>
                        <span class="value">${processed} / ${total}</span>
                    </div>
                    <div class="summary-cell">
                        <span class="label">Progress</span>
                        <span class="value">${percent.toFixed(1)}%</span>
                    </div>
                    <div class="summary-cell">
                        <span class="label">Status</span>
                        <span class="value">${escapeHtml(data.status || 'initializing')}</span>
                    </div>
                </div>
                <progress value="${processed}" max="${Math.max(total, 1)}" aria-label="Batch progress"></progress>
            `;

            const rows = Object.entries(data.detailed_counts || {}).filter(([, count]) => Number(count) > 0);
            statusBreakdown.innerHTML = rows.length ? `
                <div class="panel-divider"></div>
                <h3 class="panel-title">Status Breakdown</h3>
                <div class="record-list">
                    ${rows.map(([status, count]) => `
                        <article class="record-card">
                            <div class="panel-header">
                                <strong>${escapeHtml(status.replace(/_/g, ' '))}</strong>
                                <span class="badge neutral-badge">${Number(count)}</span>
                            </div>
                        </article>
                    `).join('')}
                </div>
            ` : '';

            currentClaim.innerHTML = data.current_claim_id ? `
                <div class="status-card info-card">
                    <strong>Currently processing</strong>
                    <span>Claim ID ${escapeHtml(data.current_claim_id)}</span>
                </div>
            ` : '';
        }

        async function updateProgress() {
            if (!batchId) {
                setStatus(progressStatus, {
                    title: 'Missing batch ID',
                    message: 'Open progress from a batch or claim run so this page can poll the right status.',
                    tone: 'warning',
                });
                return;
            }

            try {
                const data = await fetchJson(`/api/v1/batch/${encodeURIComponent(batchId)}/progress`);
                renderProgress(data);
                if (data.status === 'completed') {
                    window.location.href = `/batch_results?batch_id=${encodeURIComponent(batchId)}`;
                    return;
                }
                if (data.status === 'error') {
                    setStatus(progressStatus, {
                        title: 'Batch error',
                        message: 'The batch reported an error. Open the batch results or trace details for diagnostics.',
                        tone: 'error',
                    });
                    return;
                }
            } catch (error) {
                setStatus(progressStatus, {
                    title: 'Progress refresh failed',
                    message: error.message || 'Unable to refresh progress.',
                    tone: 'warning',
                });
            }
            window.setTimeout(updateProgress, 5000);
        }

        renderReferences();
        updateProgress();
    </script>
{% endblock %}
